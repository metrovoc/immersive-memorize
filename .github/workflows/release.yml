name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run package

      - name: Read version
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: immersive-memorize-${{ steps.version.outputs.version }}
          path: immersive-memorize-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The changelog section of this version, without its heading.
          changes=$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found' CHANGELOG.md)
          previous=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          {
            sed "s/{{VERSION}}/$VERSION/" .github/templates/release-notes.md | sed '/{{CHANGES}}/,$d'
            echo "${changes:-- Maintenance release.}"
            sed '1,/{{CHANGES}}/d' .github/templates/release-notes.md
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/$REPOSITORY/compare/$previous...$VERSION"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Immersive Memorize ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: immersive-memorize-${{ steps.version.outputs.version }}.zip
